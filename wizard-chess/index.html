<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Chess</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#080511;color:#eee;font-family:Georgia,serif}#app{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;top:20px;left:20px;z-index:2;padding:16px 20px;border:1px solid #8064a9;border-radius:12px;background:rgba(12,7,24,.82);backdrop-filter:blur(8px);box-shadow:0 0 30px rgba(123,75,180,.25)}h1{margin:0 0 6px;font-size:26px}.status{font-family:system-ui,sans-serif;font-size:14px;color:#cfc3e8}.hint{margin-top:8px;font-size:12px;color:#9f91b8}button{margin-top:10px;padding:8px 12px;border:1px solid #8f6bc1;border-radius:8px;background:#25153c;color:#fff;cursor:pointer}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"}}</script>
</head><body><div id="app"></div><div class="hud"><h1>Wizard Chess</h1><div id="status" class="status">Loading 3D board…</div><div class="hint">Drag to orbit • Scroll to zoom • Click a piece</div><button id="reset">Reset Game</button></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.js';
const statusEl=document.getElementById('status'),app=document.getElementById('app');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080511);scene.fog=new THREE.Fog(0x080511,16,32);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,12,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.minDistance=9;controls.maxDistance=22;
scene.add(new THREE.HemisphereLight(0x8870b0,0x17101e,2));const key=new THREE.DirectionalLight(0xffe6c0,4);key.position.set(5,12,6);key.castShadow=true;scene.add(key);
const square=1.15,board=new THREE.Group();scene.add(board);
for(let z=0;z<8;z++)for(let x=0;x<8;x++){const s=new THREE.Mesh(new THREE.BoxGeometry(square,.25,square),new THREE.MeshStandardMaterial({color:(x+z)%2?0x2b1d39:0xb8a0ce,roughness:.75}));s.position.set((x-3.5)*square,0,(z-3.5)*square);s.receiveShadow=true;s.userData={x,z};board.add(s)}
const base=new THREE.Mesh(new THREE.BoxGeometry(10.2,.6,10.2),new THREE.MeshStandardMaterial({color:0x120b19,metalness:.4,roughness:.45}));base.position.y=-.4;base.receiveShadow=true;scene.add(base);
const pieces=new THREE.Group();scene.add(pieces);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let selected=null,turn='w';const glyph={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};
function pieceMesh(type,color,x,z){const group=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.35,emissive:color,emissiveIntensity:.05});const body=new THREE.Mesh(new THREE.CylinderGeometry(.28,.38,.7,24),mat);body.position.y=.5;body.castShadow=true;group.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.3,24,16),mat);head.position.y=.98;head.castShadow=true;group.add(head);const label=document.createElement('canvas');label.width=128;label.height=128;const ctx=label.getContext('2d');ctx.fillStyle='#fff';ctx.font='92px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(glyph[type],64,64);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(label),transparent:true}));sprite.scale.set(.8,.8,1);sprite.position.y=1.65;group.add(sprite);group.position.set((x-3.5)*square,.05,(z-3.5)*square);group.userData={type,colorSide:color===0xf1dfbd?'w':'b',x,z};pieces.add(group)}
function setup(){while(pieces.children.length)pieces.remove(pieces.children[0]);const order=['r','n','b','q','k','b','n','r'];for(let x=0;x<8;x++){pieceMesh(order[x],0xf1dfbd,x,7);pieceMesh('p',0xf1dfbd,x,6);pieceMesh('p',0x3d2856,x,1);pieceMesh(order[x],0x3d2856,x,0)}turn='w';selected=null;statusEl.textContent="White's turn"}setup();
function select(p){if(selected===p){selected=null;statusEl.textContent=`${turn==='w'?'White':'Black'}'s turn`;return}if(p.userData.colorSide!==turn)return;selected=p;statusEl.textContent=`${turn==='w'?'White':'Black'}: ${glyph[p.userData.type]} selected — click a destination`}
function move(squareObj){const hit=squareObj.userData,src=selected.userData;if(Math.abs(hit.x-src.x)+Math.abs(hit.z-src.z)>2)return;selected.position.set((hit.x-3.5)*square,.05,(hit.z-3.5)*square);src.x=hit.x;src.z=hit.z;turn=turn==='w'?'b':'w';selected=null;statusEl.textContent=`${turn==='w'?'White':'Black'}'s turn`}
renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects([...pieces.children,...board.children],true);if(!hits.length)return;let o=hits[0].object;while(o.parent&&o.parent!==pieces&&o.parent!==board)o=o.parent;if(o.parent===pieces){select(o);return}if(selected&&o.parent===board)move(o)});document.getElementById('reset').onclick=setup;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
