<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Chess</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#3b1d4d,#09060d 72%);color:#fff;font-family:Georgia,serif}body{padding:12px;display:flex;justify-content:center;align-items:flex-start}.wrap{width:100%;max-width:1280px;display:grid;grid-template-columns:240px minmax(420px,760px) 155px;gap:14px;align-items:start}.panel,.captured{background:#100a16f5;border:1px solid #8d67aa;border-radius:15px;padding:15px;box-shadow:0 12px 40px #0009}.panel{margin-top:4px}.panel h1{margin:0 0 5px;font-size:26px}.sub,.help,.move,.thinking,.row{font-family:system-ui,sans-serif}.sub{font-size:12px;color:#c9b9d2;margin-bottom:14px}.status{font:14px system-ui;min-height:22px}.row{display:flex;gap:6px;align-items:center;margin:10px 0}.row label{font-size:12px}.row select,.row button{background:#2a1937;color:#fff;border:1px solid #9870b7;border-radius:8px;padding:8px;font-size:12px}.row button{cursor:pointer}.thinking{display:none;color:#dfb8ff;font-size:12px;margin:8px 0}.move{font-size:12px;color:#cdbed5;margin:8px 0}.help{margin-top:13px;font-size:11px;line-height:1.55;color:#aaa0b1}.frame{width:100%;padding:10px;background:#17101d;border:2px solid #68487a;border-radius:17px;box-shadow:0 18px 55px #000b}.board{width:min(100%,calc(100vh - 36px));max-width:740px;margin:auto;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:5px solid #3b2547;border-radius:7px;overflow:hidden;user-select:none}.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}.light{background:#ead9df}.dark{background:#49354c}.sq:hover{filter:brightness(1.1)}.sq.sel{box-shadow:inset 0 0 0 4px #c68be7}.sq.legal:after{content:"";width:17%;height:17%;background:#b968db;border-radius:50%;box-shadow:0 0 15px #d89aff;position:absolute}.sq.capture:after{content:"⚔";position:absolute;width:72%;height:72%;display:flex;align-items:center;justify-content:center;border:3px solid #ff9a45;border-radius:50%;color:#ffb46f;font:20px system-ui;box-shadow:0 0 16px #ff8b38;background:#5b251c55}.sq.last{box-shadow:inset 0 0 0 999px #d4a84d22}.piece{z-index:2;width:90%;height:90%;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 4px 4px #0008);transition:transform .12s}.sq:hover .piece{transform:translateY(-2px)}.wizard{width:78%;height:78%;max-width:72px;max-height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid currentColor;box-shadow:inset 0 0 12px #fff3,0 4px 8px #0007}.wizard svg{width:100%;height:100%}.piece.white .wizard{color:#fff3cf;background:linear-gradient(145deg,#fff8e9,#d7b5ff);border-color:#fff1c2}.piece.black .wizard{color:#d7b8ff;background:linear-gradient(145deg,#352045,#100b18);border-color:#9c6dcc;box-shadow:inset 0 0 14px #9b5dff33,0 4px 8px #0009}.piece.white .tag{background:#fff0cf;color:#4b275c}.piece.black .tag{background:#24152f;color:#e7cfff;border:1px solid #765098}.tag{font:700 clamp(7px,1vw,11px) system-ui;padding:2px 4px;border-radius:5px;margin-top:2px;white-space:nowrap}.coord{position:absolute;font:9px system-ui;opacity:.45;z-index:3}.rank{left:3px;top:2px}.file{right:3px;bottom:2px}.captured h3{margin:0 0 10px;font-size:16px}.capTitle{font:10px system-ui;color:#aaa0b1;margin:9px 0 3px}.caps{min-height:48px;display:flex;flex-wrap:wrap;gap:3px;font-size:24px}.empty{font:11px system-ui;color:#756a7c}.flash{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;z-index:20;font:bold clamp(40px,8vw,88px) Georgia;text-shadow:0 0 8px #fff,0 0 30px #d16cff,0 5px 0 #2b1737}.flash.show{animation:flash .9s ease-out}.flash.good{color:#d9ffb5}.flash.oops{color:#ffb18f}.flash.check{color:#fff09a}.flash.mate{color:#ff86d9}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.12)}}@media(max-width:1080px){.wrap{grid-template-columns:210px minmax(0,1fr);max-width:850px}.captured{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.captured h3{grid-column:1/-1}.board{width:min(100%,calc(100vh - 250px))}}@media(max-width:720px){body{padding:6px}.wrap{grid-template-columns:1fr}.panel{order:2}.frame{order:1}.captured{order:3;grid-column:auto}.board{width:100%;max-width:none}.wizard{width:82%;height:82%}.panel h1{font-size:23px}}@media(max-height:700px) and (min-width:721px){.board{width:min(100%,calc(100vh - 28px))}.panel,.captured{font-size:90%}}</style></head><body><div class="wrap"><div class="panel"><h1>🧙 Wizard Chess</h1><div class="sub">2D fantasy chess • You are the Light Wizards</div><div id="status" class="status">Loading…</div><div class="row"><label>CPU</label><select id="difficulty"><option value="amateur">Amateur</option><option value="professional" selected>Professional</option><option value="expert">Expert</option></select><button id="reset">New Game</button></div><div id="thinking" class="thinking">🪄 Dark Wizard is thinking…</div><div id="last" class="move"></div><div class="help"><b>How to play</b><br>Click your wizard, then click a glowing square.<br><br>🟣 Move &nbsp; ⚔ Capture<br><br><b>Light Wizards</b> = bright robes<br><b>Dark Wizards</b> = dark robes + purple magic</div></div><div class="frame"><div id="board" class="board"></div></div><div class="captured"><h3>☠ Captured</h3><div><div class="capTitle">YOUR CAPTURES</div><div id="capBlack" class="caps"><span class="empty">None</span></div></div><div><div class="capTitle">CPU CAPTURES</div><div id="capWhite" class="caps"><span class="empty">None</span></div></div></div></div><div id="flash" class="flash"></div><script type="module">import{Chess}from'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';const $=id=>document.getElementById(id),board=$('board'),status=$('status'),thinking=$('thinking'),last=$('last'),difficulty=$('difficulty'),capBlack=$('capBlack'),capWhite=$('capWhite'),flash=$('flash'),game=new Chess();let selected=null,locked=false,lastSquares=[],capturedW=[],capturedB=[],previousCpu=null;const labels={p:'Apprentice',n:'Knight',b:'Seer',r:'Guardian',q:'Queen',k:'King'};const glyph={p:'P',n:'N',b:'B',r:'R',q:'Q',k:'K'};function svg(t){const common='<path d="M50 9 '+(t==='k'||t==='q'?'L50 18':'')+'" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="25" r="13" fill="currentColor"/><path d="M35 39 Q50 29 65 39 L73 79 Q50 92 27 79Z" fill="currentColor" opacity=".9"/>';let extra='';if(t==='p')extra='<path d="M29 43 L17 68 L30 65" stroke="currentColor" stroke-width="5" fill="none"/><path d="M71 43 L83 68 L70 65" stroke="currentColor" stroke-width="5" fill="none"/>';if(t==='n')extra='<path d="M38 43 Q22 25 27 14 Q43 12 58 30 L72 45" fill="none" stroke="currentColor" stroke-width="7"/><path d="M58 20 L78 15 L70 31" fill="currentColor"/>';if(t==='b')extra='<path d="M68 40 L84 78" stroke="currentColor" stroke-width="6"/><path d="M78 73 L88 82 L75 86" fill="currentColor"/>';if(t==='r')extra='<path d="M26 40 L12 35 L15 72 L29 75 M74 40 L88 35 L85 72 L71 75" fill="currentColor"/>';if(t==='q')extra='<path d="M25 20 L33 8 L42 20 L50 6 L58 20 L67 8 L75 20" fill="none" stroke="currentColor" stroke-width="6"/><path d="M78 35 L88 72" stroke="currentColor" stroke-width="6"/>';if(t==='k')extra='<path d="M50 3 L50 25 M40 14 L60 14" stroke="currentColor" stroke-width="7"/><path d="M76 36 L89 72" stroke="currentColor" stroke-width="6"/>';return '<svg viewBox="0 0 100 100" aria-hidden="true">'+common+extra+'</svg>'}function showFlash(t,type=''){flash.textContent=t;flash.className='flash '+type;void flash.offsetWidth;flash.classList.add('show');setTimeout(()=>flash.className='flash',950)}function beep(ok=true){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?700:180;o.type=ok?'sine':'sawtooth';g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}}function caps(){capBlack.innerHTML=capturedB.length?capturedB.map(t=>'<span title="'+labels[t]+'">'+glyph[t]+'</span>').join(' '):'<span class="empty">None</span>';capWhite.innerHTML=capturedW.length?capturedW.map(t=>'<span title="'+labels[t]+'">'+glyph[t]+'</span>').join(' '):'<span class="empty">None</span>'}function render(){board.innerHTML='';const rows=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=String.fromCharCode(97+c)+(8-r),p=rows[r][c],el=document.createElement('div');el.className='sq '+((r+c)%2?'dark':'light');if(sq===selected)el.classList.add('sel');if(lastSquares.includes(sq))el.classList.add('last');if(selected){const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)el.classList.add(m.captured?'capture':'legal')}if(c===0){const z=document.createElement('span');z.className='coord rank';z.textContent=8-r;el.appendChild(z)}if(r===7){const z=document.createElement('span');z.className='coord file';z.textContent=String.fromCharCode(97+c);el.appendChild(z)}if(p){const q=document.createElement('div');q.className='piece '+(p.color==='w'?'white':'black');q.innerHTML='<div class="wizard">'+svg(p.type)+'</div><div class="tag">'+(p.color==='w'?'LIGHT ':'DARK ')+labels[p.type]+'</div>';q.onclick=e=>{e.stopPropagation();if(!locked&&game.turn()==='w'&&p.color==='w')select(sq)};el.appendChild(q)}el.onclick=()=>clickSquare(sq);board.appendChild(el)}caps()}function select(sq){if(game.turn()!=='w'||locked||game.isGameOver())return;if(!game.moves({square:sq}).length){showFlash('OOPS','oops');beep(false);return}selected=selected===sq?null:sq;render()}function clickSquare(sq){if(locked||game.turn()!=='w'||game.isGameOver())return;const p=game.get(sq);if(p?.color==='w'){select(sq);return}if(!selected)return;const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(!m){showFlash('OOPS','oops');beep(false);return}play(selected,sq,true)}function play(from,to,human){const target=game.get(to);const mv=game.move({from,to,promotion:'q'});lastSquares=[mv.from,mv.to];selected=null;last.textContent=(human?'You: ':'CPU: ')+mv.san;if(target||mv.captured){if(human)capturedB.push(mv.captured);else capturedW.push(mv.captured);showFlash('⚔ CAPTURE!','good');beep(true)}render();if(game.isCheckmate()){status.textContent='CHECKMATE — '+(game.turn()==='w'?'Dark Wizards win!':'YOU WIN!');locked=true;thinking.style.display='none';showFlash('CHECKMATE!','mate');return}if(game.isDraw()){status.textContent='DRAW';locked=true;return}if(game.inCheck()){status.textContent='⚠ CHECK!';showFlash('CHECK!','check');beep(true)}else status.textContent=game.turn()==='w'?'Your turn — choose a Light Wizard':'Dark Wizard CPU';if(human)setTimeout(cpu,350)}const val={p:100,n:320,b:330,r:500,q:900,k:20000};function evaluate(){if(game.isCheckmate())return game.turn()==='b'?999999:-999999;if(game.isDraw())return 0;let s=0;for(const row of game.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*val[p.type];return s}function search(depth,a,b,max){if(depth<=0||game.isGameOver())return evaluate();const ms=game.moves({verbose:true});if(max){let v=-1e9;for(const m of ms){game.move(m);v=Math.max(v,search(depth-1,a,b,false));game.undo();a=Math.max(a,v);if(a>=b)break}return v}else{let v=1e9;for(const m of ms){game.move(m);v=Math.min(v,search(depth-1,a,b,true));game.undo();b=Math.min(b,v);if(a>=b)break}return v}}function cpuPick(){const depth={amateur:1,professional:2,expert:3}[difficulty.value],moves=game.moves({verbose:true}),scores=[];for(const m of moves){game.move(m);const v=search(depth-1,-1e9,1e9,false);game.undo();let penalty=0;if(previousCpu&&m.from===previousCpu.to&&m.to===previousCpu.from)penalty=250;let capture=m.captured?5000:0;let check=m.san?.includes('+')?3000:0;scores.push({m,v:v+capture+check-penalty})}scores.sort((a,b)=>b.v-a.v);let pool=difficulty.value==='amateur'?scores.slice(0,Math.min(5,scores.length)):scores;return pool[Math.floor(Math.random()*Math.min(difficulty.value==='expert'?2:3,pool.length))]}async function cpu(){if(game.turn()!=='b'||game.isGameOver())return;locked=true;thinking.style.display='block';status.textContent='Dark Wizard is thinking…';await new Promise(r=>setTimeout(r,500));const choice=cpuPick();previousCpu=choice.m;play(choice.m.from,choice.m.to,false);locked=false;thinking.style.display='none';if(game.turn()==='w'&&!game.isGameOver())status.textContent=game.inCheck()?'⚠ CHECK!':'Your turn — choose a Light Wizard'}function reset(){game.reset();selected=null;locked=false;lastSquares=[];capturedW=[];capturedB=[];previousCpu=null;last.textContent='';render();status.textContent='Your turn — choose a Light Wizard';thinking.style.display='none'}$('reset').onclick=reset;reset();</script></body></html>
