<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Chess</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07050a;color:#fff;font-family:Georgia,serif}#app{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;top:18px;left:18px;z-index:5;width:300px;padding:18px 20px;border:1px solid #8b6aa9;border-radius:14px;background:rgba(13,9,18,.9);box-shadow:0 8px 35px #0008}.hud h1{margin:0 0 5px;font-size:28px}.sub{font:12px system-ui;color:#b9acc4;margin-bottom:13px}.status{font:14px system-ui;color:#f0e8f5;min-height:20px}.row{display:flex;gap:8px;align-items:center;margin-top:12px}.row label{font:12px system-ui;color:#cfc2d8}.row select,.row button{background:#281934;color:#fff;border:1px solid #9672b7;border-radius:8px;padding:8px 10px;font:13px system-ui}.row button{cursor:pointer}.hint{margin-top:12px;font:12px system-ui;color:#a99caf;line-height:1.5}.thinking{display:none;margin-top:9px;color:#dcb9ff;font:12px system-ui}.move{margin-top:8px;font:12px system-ui;color:#cdbddd}.brilliant{display:none;margin-top:8px;width:max-content;padding:4px 8px;border-radius:999px;background:#4c2d67;color:#f0d8ff;font:11px system-ui}.tip{position:fixed;right:18px;bottom:16px;padding:8px 10px;border-radius:8px;background:#09060dcc;color:#9f94a8;font:11px system-ui}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"}}</script>
</head>
<body><div id="app"></div>
<div class="hud"><h1>Wizard Chess</h1><div class="sub">White Wizard vs Dark Wizard CPU</div><div id="status" class="status">Loading magical board…</div>
<div class="row"><label>Difficulty</label><select id="difficulty"><option value="amateur">Amateur</option><option value="professional" selected>Professional</option><option value="expert">Expert</option></select><button id="reset">New Game</button></div>
<div id="thinking" class="thinking">🪄 Dark wizard is thinking…</div><div id="lastMove" class="move"></div><div id="brilliant" class="brilliant">✨ BRILLIANT MOVE</div>
<div class="hint"><b>Easy controls:</b> click a wizard, then click a glowing square. No board rotation. The board stays steady.</div></div>
<div class="tip">Click-to-move • Glowing rings = legal moves</div>
<script type="module">
import * as THREE from 'three';
import {Chess} from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

const $=id=>document.getElementById(id),status=$('status'),thinking=$('thinking'),lastMove=$('lastMove'),brilliant=$('brilliant'),difficulty=$('difficulty');
const game=new Chess();let selected=null,locked=false;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07050a);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(0,12.8,13.8);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('app').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb79bd0,0x160d1b,2.2));const key=new THREE.DirectionalLight(0xffe4bd,4.4);key.position.set(5,13,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const glow=new THREE.PointLight(0x8d48d9,25,18);glow.position.set(-5,5,-5);scene.add(glow);
const S=1.15,board=new THREE.Group(),pieces=new THREE.Group(),markers=new THREE.Group();scene.add(board,pieces,markers);
const tiles=[];
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const m=new THREE.MeshStandardMaterial({color:(r+c)%2?0x30223a:0xc7b5c9,roughness:.7,metalness:.05});const t=new THREE.Mesh(new THREE.BoxGeometry(S,.24,S),m);t.position.set((c-3.5)*S,0,(r-3.5)*S);t.receiveShadow=true;t.userData={square:String.fromCharCode(97+c)+(8-r),c,r};board.add(t);tiles.push(t)}
const base=new THREE.Mesh(new THREE.BoxGeometry(10.4,.72,10.4),new THREE.MeshStandardMaterial({color:0x151019,metalness:.55,roughness:.38}));base.position.y=-.45;base.receiveShadow=true;scene.add(base);
const trim=new THREE.Mesh(new THREE.BoxGeometry(9.9,.1,9.9),new THREE.MeshStandardMaterial({color:0x46314d,metalness:.35,roughness:.45}));trim.position.y=-.06;scene.add(trim);
const robe={w:0xd8c8dd,b:0x302331},skin={w:0xd9a986,b:0x744d43},accent={w:0xe5c66f,b:0x7041b0};
function M(color,metal=.15,rough=.5){return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough})}
function wizard(p,sq){
 const g=new THREE.Group();g.userData={square:sq};const isPawn=p.type==='p',scale=isPawn?.83:1;
 const body=new THREE.Mesh(new THREE.ConeGeometry(isPawn?.28:.4,isPawn?.78:1.05,24),M(robe[p.color],.2,.55));body.position.y=isPawn?.43:.57;body.castShadow=true;g.add(body);
 const belt=new THREE.Mesh(new THREE.CylinderGeometry(isPawn?.25:.36,isPawn?.25:.36,.1,24),M(accent[p.color],.45,.3));belt.position.y=isPawn?.72:.91;g.add(belt);
 const head=new THREE.Mesh(new THREE.SphereGeometry(isPawn?.22:.29,24,18),M(skin[p.color],.03,.58));head.position.y=isPawn?.95:1.25;head.castShadow=true;g.add(head);
 const brim=new THREE.Mesh(new THREE.CylinderGeometry(isPawn?.29:.39,isPawn?.29:.39,.08,24),M(accent[p.color],.2,.45));brim.position.y=isPawn?1.15:1.56;g.add(brim);
 const hat=new THREE.Mesh(new THREE.ConeGeometry(isPawn?.2:.29,isPawn?.48:.62,24),M(robe[p.color],.2,.5));hat.position.y=isPawn?1.39:1.86;hat.rotation.z=p.color==='w'?.06:-.06;g.add(hat);
 const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.085),new THREE.MeshStandardMaterial({color:accent[p.color],emissive:accent[p.color],emissiveIntensity:2.3,metalness:.25,roughness:.2}));crystal.position.set(0,isPawn?1.65:2.15,0);g.add(crystal);
 if(!isPawn){const staff=new THREE.Mesh(new THREE.CylinderGeometry(.035,.055,1.05,10),M(0x5a3b27,.1,.65));staff.position.set(.39,.58,0);staff.rotation.z=-.15;staff.castShadow=true;g.add(staff);const orb=crystal.clone();orb.scale.set(1.35,1.35,1.35);orb.position.set(.48,1.15,0);g.add(orb)}
 if(p.type==='k'||p.type==='q'){for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(.18,.025,8,20),M(accent[p.color],.5,.25));ring.rotation.x=Math.PI/2;ring.position.y=(p.type==='k'?2.06:1.98)+i*.055;g.add(ring)}}
 if(p.type==='r'){const shoulder=new THREE.Mesh(new THREE.BoxGeometry(.58,.12,.22),M(accent[p.color],.3,.35));shoulder.position.y=1.02;g.add(shoulder)}
 if(p.type==='n'){for(const x of [-.16,.16]){const ear=new THREE.Mesh(new THREE.ConeGeometry(.075,.22,10),M(robe[p.color],.15,.5));ear.position.set(x,1.5,0);ear.rotation.z=x<0?-.35:.35;g.add(ear)}}
 g.scale.setScalar(scale);g.position.copy(pos(sq));g.position.y=.08;return g;
}
function pos(sq){const c=sq.charCodeAt(0)-97,r=8-Number(sq[1]);return new THREE.Vector3((c-3.5)*S,.08,(r-3.5)*S)}
function clear(g){while(g.children.length)g.remove(g.children[0])}
function draw(){clear(pieces);clear(markers);for(const row of game.board())for(const p of row)if(p){const sq=p.square;pieces.add(wizard(p,sq))}if(selected){for(const m of game.moves({square:selected,verbose:true})){const ring=new THREE.Mesh(new THREE.RingGeometry(.13,.21,24),new THREE.MeshBasicMaterial({color:m.captured?0xff9f45:0xd7a8ff,transparent:true,opacity:.95,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.copy(pos(m.to));ring.position.y=.15;ring.userData.to=m.to;markers.add(ring)}}}
function text(){if(game.isCheckmate()){status.textContent=game.turn()==='w'?'Checkmate — Dark Wizard wins!':'Checkmate — You win!';locked=true;thinking.style.display='none';return}if(game.isDraw()){status.textContent='Draw — the magical battle ends.';locked=true;return}if(game.turn()==='w'){status.textContent=game.inCheck()?'⚠️ Your King is in check!':'Your turn — choose a wizard';thinking.style.display='none'}else{status.textContent='Dark Wizard CPU';thinking.style.display='block'}}
function reset(){game.reset();selected=null;locked=false;lastMove.textContent='';brilliant.style.display='none';draw();text()}$('reset').onclick=reset;
const val={p:100,n:320,b:330,r:500,q:900,k:20000};
function evaluate(){if(game.isCheckmate())return game.turn()==='b'?999999:-999999;if(game.isDraw())return 0;let score=0;for(const row of game.board())for(const p of row)if(p)score+=(p.color==='b'?1:-1)*val[p.type];score+=(game.moves().length)*(game.turn()==='b'?1:-1)*2;return score}
function search(depth,a,b,max){if(depth===0||game.isGameOver())return evaluate();const ms=game.moves({verbose:true});if(max){let best=-1e9;for(const m of ms){game.move(m);best=Math.max(best,search(depth-1,a,b,false));game.undo();a=Math.max(a,best);if(b<=a)break}return best}else{let best=1e9;for(const m of ms){game.move(m);best=Math.min(best,search(depth-1,a,b,true));game.undo();b=Math.min(b,best);if(b<=a)break}return best}}
function cpuPick(){const cfg={amateur:[1,.32],professional:[2,.08],expert:[3,.015]}[difficulty.value],ms=game.moves({verbose:true}),scores=[];for(const m of ms){game.move(m);const score=search(cfg[0]-1,-1e9,1e9,false);game.undo();scores.push({m,score})}scores.sort((a,b)=>b.score-a.score);let pick=scores[0];if(Math.random()<cfg[1])pick=scores[Math.floor(Math.random()*Math.min(4,scores.length))];return {pick,margin:pick.score-(scores[1]?.score??pick.score)}}
async function cpu(){if(game.turn()!=='b'||game.isGameOver())return;locked=true;text();await new Promise(r=>setTimeout(r,550));const x=cpuPick();const mv=game.move(x.pick.m);selected=null;draw();lastMove.textContent='CPU: '+mv.san;brilliant.style.display=(difficulty.value==='expert'&&(x.margin>80||mv.san.includes('#')||mv.san.includes('+')||mv.captured==='q'))?'block':'none';locked=false;text()}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',async e=>{if(locked||game.turn()!=='w'||game.isGameOver())return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects([...pieces.children,...markers.children,...tiles],true);if(!hits.length)return;let o=hits[0].object;while(o.parent&&o.parent!==pieces)o=o.parent;if(o.parent===markers){const to=o.userData.to;if(selected){const legal=game.moves({square:selected,verbose:true}).find(m=>m.to===to);if(legal){const mv=game.move({from:selected,to,promotion:'q'});lastMove.textContent='You: '+mv.san;selected=null;draw();text();setTimeout(cpu,180)} }return}if(o.parent===pieces){const sq=o.userData.square;selected=game.moves({square:sq}).length?sq:selected;draw();return}if(o.userData.square&&selected){const legal=game.moves({square:selected,verbose:true}).find(m=>m.to===o.userData.square);if(legal){const mv=game.move({from:selected,to:o.userData.square,promotion:'q'});lastMove.textContent='You: '+mv.san;selected=null;draw();text();setTimeout(cpu,180)}}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
reset();function animate(t){requestAnimationFrame(animate);pieces.children.forEach((g,i)=>{g.position.y=.08+Math.sin(t*.0015+i)*.008});renderer.render(scene,camera)}animate(0);
</script></body></html>
