<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wizard Chess</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle,#32183f,#09060d 70%);color:#fff;font-family:Georgia,serif;display:flex;justify-content:center;align-items:center;padding:16px}.wrap{width:min(1120px,100%);display:grid;grid-template-columns:280px minmax(0,760px);gap:22px;align-items:center}.panel{background:#100a16f5;border:1px solid #8d67aa;border-radius:16px;padding:18px;box-shadow:0 12px 45px #0009}.panel h1{margin:0 0 5px;font-size:29px}.sub{font:13px system-ui;color:#c0b1c8;margin-bottom:17px}.status{font:15px system-ui;min-height:22px}.row{display:flex;gap:8px;align-items:center;margin:12px 0}.row label{font:13px system-ui}.row select,.row button{background:#2a1937;color:#fff;border:1px solid #9870b7;border-radius:8px;padding:9px;font:13px system-ui}.row button{cursor:pointer}.thinking{display:none;color:#dfb8ff;font:13px system-ui;margin:10px 0}.move{font:13px system-ui;color:#cdbed5;margin:8px 0}.brilliant{display:none;background:#56316e;border-radius:20px;padding:6px 10px;width:max-content;font:12px system-ui}.help{margin-top:16px;font:12px/1.6 system-ui;color:#ada1b2}.frame{padding:13px;background:#17101d;border:2px solid #68487a;border-radius:18px;box-shadow:0 18px 55px #000b}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:6px solid #3b2547;border-radius:7px;overflow:hidden;user-select:none}.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}.light{background:#ead9df}.dark{background:#49354c}.sq:hover{filter:brightness(1.08)}.sq.sel{box-shadow:inset 0 0 0 5px #c68be7}.sq.legal:after{content:"";width:20%;height:20%;background:#b968db;border-radius:50%;box-shadow:0 0 16px #d89aff;position:absolute}.sq.capture:after{content:"";position:absolute;width:70%;height:70%;border:4px solid #e28a50;border-radius:50%;box-shadow:0 0 14px #e28a50}.piece{z-index:2;width:92%;height:92%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s;filter:drop-shadow(0 5px 4px #0008)}.sq:hover .piece{transform:translateY(-3px)}.icon{font-size:clamp(27px,5vw,55px);line-height:.9}.name{font:700 clamp(8px,1.15vw,14px) system-ui;padding:2px 5px;border-radius:6px;background:#0006;margin-top:3px}.white .name{color:#fff0cf}.black .name{color:#dcc7ff}.coord{position:absolute;font:9px system-ui;opacity:.4}.rank{left:3px;top:2px}.file{right:3px;bottom:2px}@media(max-width:850px){body{padding:8px;align-items:flex-start}.wrap{grid-template-columns:1fr;max-width:720px}.panel{order:2}.frame{order:1}}</style></head><body><div class="wrap"><div class="panel"><h1>🧙 Wizard Chess</h1><div class="sub">Easy 2D board • White vs Dark Wizard CPU</div><div id="status" class="status">Loading…</div><div class="row"><label>CPU</label><select id="difficulty"><option value="amateur">Amateur</option><option value="professional" selected>Professional</option><option value="expert">Expert</option></select><button id="reset">New Game</button></div><div id="thinking" class="thinking">🪄 Dark Wizard is thinking…</div><div id="last" class="move"></div><div id="brilliant" class="brilliant">✨ BRILLIANT MOVE</div><div class="help"><b>How to move:</b><br>1. Click your wizard.<br>2. Purple dots show legal moves.<br>3. Click a purple square.<br><br><b>No camera. No rotation. Just click-to-move.</b></div></div><div class="frame"><div id="board" class="board"></div></div></div><script type="module">import{Chess}from'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';const $=x=>document.getElementById(x),board=$('board'),status=$('status'),thinking=$('thinking'),last=$('last'),brilliant=$('brilliant'),difficulty=$('difficulty'),game=new Chess();let selected=null,locked=false,lastSquares=[];const icon={p:'🧙',n:'🐎',b:'🔮',r:'🛡️',q:'👑',k:'✚'},name={p:'Apprentice',n:'Knight',b:'Seer',r:'Guardian',q:'Queen',k:'King'};function render(){board.innerHTML='';const rows=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){let sq=String.fromCharCode(97+c)+(8-r),p=rows[r][c],el=document.createElement('div');el.className='sq '+((r+c)%2?'dark':'light');el.dataset.sq=sq;if(sq===selected)el.classList.add('sel');if(lastSquares.includes(sq))el.classList.add('last');if(selected){let m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)el.classList.add(m.captured?'capture':'legal')}if(c===0){let z=document.createElement('span');z.className='coord rank';z.textContent=8-r;el.appendChild(z)}if(r===7){let z=document.createElement('span');z.className='coord file';z.textContent=String.fromCharCode(97+c);el.appendChild(z)}if(p){let q=document.createElement('div');q.className='piece '+(p.color==='w'?'white':'black');q.innerHTML='<div class="icon">'+icon[p.type]+'</div><div class="name">'+name[p.type]+'</div>';q.onclick=e=>{e.stopPropagation();if(!locked&&game.turn()==='w'&&p.color==='w')select(sq)};el.appendChild(q)}el.onclick=()=>clickSquare(sq);board.appendChild(el)}}function select(sq){if(game.moves({square:sq}).length===0)return;selected=selected===sq?null:sq;render()}function clickSquare(sq){if(locked||game.turn()!=='w'||game.isGameOver())return;let p=game.get(sq);if(p?.color==='w'){select(sq);return}if(selected){let m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(!m)return;let mv=game.move({from:selected,to:sq,promotion:'q'});lastSquares=[mv.from,mv.to];last.textContent='You: '+mv.san;selected=null;render();update();setTimeout(cpu,300)}}function update(){if(game.isCheckmate()){status.textContent=game.turn()==='w'?'Checkmate — Dark Wizard wins!':'Checkmate — You win!';locked=true;thinking.style.display='none';return}if(game.isDraw()){status.textContent='Draw';locked=true;thinking.style.display='none';return}if(game.turn()==='w'){status.textContent=game.inCheck()?'⚠️ Your King is in check!':'Your turn — click a wizard';thinking.style.display='none'}else{status.textContent='Dark Wizard CPU';thinking.style.display='block'}}const val={p:100,n:320,b:330,r:500,q:900,k:20000};function score(){if(game.isCheckmate())return game.turn()==='b'?999999:-999999;let s=0;for(let row of game.board())for(let p of row)if(p)s+=(p.color==='b'?1:-1)*val[p.type];return s}function search(d,a,b,max){if(!d||game.isGameOver())return score();let ms=game.moves({verbose:true});if(max){let v=-1e9;for(let m of ms){game.move(m);v=Math.max(v,search(d-1,a,b,false));game.undo();a=Math.max(a,v);if(a>=b)break}return v}else{let v=1e9;for(let m of ms){game.move(m);v=Math.min(v,search(d-1,a,b,true));game.undo();b=Math.min(b,v);if(a>=b)break}return v}}function cpuPick(){let cfg={amateur:[1,.4],professional:[2,.08],expert:[3,.01]}[difficulty.value],ms=game.moves({verbose:true}),arr=[];for(let m of ms){game.move(m);let v=search(cfg[0]-1,-1e9,1e9,false);game.undo();arr.push({m,v})}arr.sort((a,b)=>b.v-a.v);let pick=arr[0];if(Math.random()<cfg[1])pick=arr[Math.floor(Math.random()*Math.min(4,arr.length))];return{pick,margin:pick.v-(arr[1]?.v??pick.v)}}async function cpu(){if(game.turn()!=='b'||game.isGameOver())return;locked=true;update();await new Promise(r=>setTimeout(r,500));let x=cpuPick(),mv=game.move(x.pick.m);lastSquares=[mv.from,mv.to];last.textContent='CPU: '+mv.san;brilliant.style.display=difficulty.value==='expert'&&(x.margin>80||mv.san.includes('#')||mv.san.includes('+'))?'block':'none';locked=false;render();update()}function reset(){game.reset();selected=null;locked=false;lastSquares=[];last.textContent='';brilliant.style.display='none';render();update()}$('reset').onclick=reset;reset();</script></body></html>
