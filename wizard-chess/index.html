<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wizard Chess</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#321b40,#100a16 48%,#07050a);color:#fff;font-family:Georgia,serif}body{padding:14px;display:flex;justify-content:center}.app{width:min(1360px,100%);display:grid;grid-template-columns:210px minmax(0,1fr) 190px;gap:14px;align-items:start}.panel,.side{background:linear-gradient(145deg,#171020,#0b0810);border:1px solid #79538e;border-radius:16px;padding:14px;box-shadow:0 14px 45px #000b}.panel h1{font-size:24px;margin:0 0 4px}.sub{font:12px system-ui;color:#cdb9d6;margin-bottom:12px}.status{font:700 14px system-ui;min-height:40px;line-height:1.4}.controls{display:grid;gap:8px}.controls select,.controls button{width:100%;padding:9px;border-radius:9px;border:1px solid #9a6ab6;background:#281836;color:white;font-weight:700;cursor:pointer}.controls button{background:linear-gradient(#633596,#32194f)}.thinking{display:none;color:#d9aaff;font:12px system-ui;margin-top:8px}.last{font:12px system-ui;color:#cfc0d5;margin-top:10px}.moves{margin-top:10px;max-height:170px;overflow:auto;font:11px system-ui;color:#cfc0d5;background:#0e0a13;border-radius:8px;padding:7px}.moves div{padding:2px 0;border-bottom:1px solid #ffffff0b}.help{font:11px system-ui;color:#aaa0b1;line-height:1.5;margin-top:12px}.game{min-width:0}.boardFrame{width:min(100%,760px);margin:auto;padding:9px;background:linear-gradient(135deg,#4b2d1e,#d09b50 20%,#3d241b 48%,#c38d48 80%,#42251b);border:3px solid #d6a957;border-radius:12px;box-shadow:0 20px 70px #000c}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:4px solid #21141a;border-radius:4px;overflow:hidden;user-select:none;touch-action:manipulation}.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}.sq.a{background:#ead9b7}.sq.b{background:#68444f}.sq:hover{filter:brightness(1.08)}.sq.selected{box-shadow:inset 0 0 0 4px #f4c94f}.sq.last{box-shadow:inset 0 0 0 999px #f5c54a30}.sq.legal:after{content:"";width:15%;height:15%;border-radius:50%;background:#b45cff;box-shadow:0 0 12px #d48cff;position:absolute;z-index:1}.sq.capture:after{content:"";width:78%;height:78%;border:4px solid #ff9a3d;border-radius:50%;box-shadow:0 0 16px #ff8b38;position:absolute;z-index:1}.sq.check{box-shadow:inset 0 0 0 5px #ff5577, inset 0 0 25px #ff174755}.coord{position:absolute;font:700 9px system-ui;opacity:.5;z-index:5}.rank{left:3px;top:2px}.file{right:3px;bottom:2px}.piece{position:relative;z-index:3;width:94%;height:94%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;filter:drop-shadow(0 5px 3px #0008);transition:transform .12s}.piece:hover{transform:translateY(-3px) scale(1.04)}.figure{width:78%;height:78%;min-width:28px;min-height:28px;max-width:88px;max-height:88px;position:relative;display:flex;align-items:center;justify-content:center}.body{position:absolute;bottom:3%;width:62%;height:57%;border-radius:42% 42% 28% 28%;border:2px solid #fff4;box-shadow:inset 0 -9px 12px #0003}.head{position:absolute;top:16%;width:30%;height:30%;border-radius:50%;z-index:3}.hat{position:absolute;top:0;width:48%;height:29%;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:4}.staff{position:absolute;width:7%;height:55%;right:7%;bottom:8%;border-radius:5px;transform:rotate(-5deg);z-index:4}.gem{position:absolute;width:10%;height:10%;border-radius:50%;right:4%;top:18%;z-index:5;box-shadow:0 0 8px currentColor}.white .body{background:linear-gradient(145deg,#fff8e6,#d2b2a2);border-color:#fff0c5}.white .head{background:#efc09d;border:2px solid #9b6c55}.white .hat{background:linear-gradient(145deg,#f7ead6,#b36f80)}.white .staff{background:#8b5b36}.white .gem{background:#7ad9ff;color:#7ad9ff}.black .body{background:linear-gradient(145deg,#392a43,#141019);border-color:#9d79b7}.black .head{background:#875948;border:2px solid #39232b}.black .hat{background:linear-gradient(145deg,#33243c,#0d0912)}.black .staff{background:#704526}.black .gem{background:#b66cff;color:#b66cff}.figure.pawn .hat{width:42%;height:25%}.figure.pawn .body{height:52%;width:55%}.figure.knight .body{width:60%;height:54%;border-radius:48% 48% 25% 25%}.figure.knight:after{content:"♞";position:absolute;font-size:clamp(22px,3.2vw,52px);top:8%;color:inherit;text-shadow:0 2px 3px #0007}.figure.knight .head,.figure.knight .hat{display:none}.figure.bishop .hat{width:35%;height:24%}.figure.bishop .body{width:48%;height:62%}.figure.bishop:after{content:"✦";position:absolute;top:4%;font-size:clamp(18px,2.5vw,40px);color:inherit}.figure.rook .hat{clip-path:none;border-radius:4px;width:52%;height:18%;top:4%}.figure.rook .body{width:57%;height:58%;border-radius:12% 12% 18% 18%}.figure.rook:after{content:"▥";position:absolute;top:2%;font-size:clamp(18px,2.6vw,42px);color:inherit}.figure.queen .hat{clip-path:polygon(10% 100%,20% 20%,38% 55%,50% 0,62% 55%,80% 20%,90% 100%);width:55%;height:30%}.figure.queen .body{width:66%;height:62%;border-radius:45% 45% 25% 25%}.figure.king .hat{clip-path:none;width:38%;height:18%;top:3%;border-radius:4px}.figure.king .body{width:70%;height:65%;border-radius:40% 40% 20% 20%}.figure.king:after{content:"✚";position:absolute;top:-3%;font-size:clamp(18px,2.6vw,44px);color:inherit}.tag{font:700 clamp(7px,1vw,11px) system-ui;padding:2px 5px;border-radius:5px;white-space:nowrap;margin-top:1px;background:#24172d;color:#f5dfff;border:1px solid #79558b}.white .tag{background:#fff0d0;color:#4b2b38;border-color:#d4a46c}.black .tag{background:#1a1221;color:#e4c4ff;border-color:#79558b}.side h3{margin:0 0 10px;font-size:16px}.capGroup{margin-bottom:15px}.capTitle{font:10px system-ui;color:#aaa0b1;margin-bottom:5px}.caps{display:flex;flex-wrap:wrap;gap:4px;min-height:35px}.capturedPiece{width:34px;height:34px;border-radius:7px;background:#25182e;border:1px solid #654674;display:flex;align-items:center;justify-content:center;font-size:21px}.empty{font:11px system-ui;color:#74687b}.reaction{margin-top:14px;padding:10px;border-radius:10px;background:#16101c;border:1px solid #4c3855;font:700 14px Georgia;text-align:center;min-height:45px}.score{font:11px system-ui;color:#a998ae;margin-top:8px;text-align:center}.flash{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;z-index:30;font:bold clamp(42px,8vw,92px) Georgia;text-shadow:0 0 10px #fff,0 0 30px #c060ff,0 5px 0 #26132f}.flash.show{animation:flash .95s ease-out}.flash.good{color:#caff9a}.flash.check{color:#fff08a}.flash.mate{color:#ff83d5}.flash.oops{color:#ffae9b}.flash.brilliant{color:#80eaff}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.12)}}@media(max-width:1050px){.app{grid-template-columns:190px minmax(0,1fr)}.side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.side h3{grid-column:1/-1}.boardFrame{max-width:min(760px,calc(100vh - 40px))}}@media(max-width:720px){body{padding:6px}.app{grid-template-columns:1fr}.panel{order:2}.game{order:1}.side{order:3;grid-column:auto;display:block}.boardFrame{padding:5px;border-width:2px}.tag{display:none}.figure{width:88%;height:88%}.coord{font-size:7px}}
</style>
</head>
<body>
<div class="app">
<section class="panel"><h1>🧙 Wizard Chess</h1><div class="sub">Fantasy chess • You play White</div><div id="status" class="status">Your turn — choose a wizard.</div><div class="controls"><select id="difficulty"><option value="amateur">Amateur</option><option value="professional" selected>Professional</option><option value="expert">Expert</option></select><button id="reset">New Game</button></div><div id="thinking" class="thinking">♟ CPU is thinking…</div><div id="last" class="last"></div><div id="moves" class="moves"></div><div class="help"><b>Easy controls</b><br>Click a wizard, then click a glowing square. Orange rings are captures.<br><br>🟣 Move &nbsp; 🟠 Capture</div></section>
<main class="game"><div class="boardFrame"><div id="board" class="board"></div></div></main>
<aside class="side"><h3>⚔ Captured Wizards</h3><div class="capGroup"><div class="capTitle">YOUR CAPTURES</div><div id="capBlack" class="caps"><span class="empty">None</span></div></div><div class="capGroup"><div class="capTitle">CPU CAPTURES</div><div id="capWhite" class="caps"><span class="empty">None</span></div></div><div id="reaction" class="reaction">Make your move!</div><div id="score" class="score">White 0 — Black 0</div></aside>
</div><div id="flash" class="flash"></div>
<script type="module">
import {Chess} from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';
const $=id=>document.getElementById(id);const board=$('board'),status=$('status'),thinking=$('thinking'),last=$('last'),movesEl=$('moves'),difficulty=$('difficulty'),capBlack=$('capBlack'),capWhite=$('capWhite'),reaction=$('reaction'),flash=$('flash'),scoreEl=$('score');
const game=new Chess();let selected=null,locked=false,lastSquares=[],capturedW=[],capturedB=[],previousCpu=null,moveNo=0;
const names={p:'Apprentice',n:'Knight',b:'Seer',r:'Guardian',q:'Queen',k:'King'};const icon={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};const value={p:100,n:320,b:330,r:500,q:900,k:20000};
function showFlash(text,type=''){flash.textContent=text;flash.className='flash '+type;void flash.offsetWidth;flash.classList.add('show');setTimeout(()=>flash.className='flash',1000)}
function beep(kind='move'){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();const f=kind==='capture'?150:kind==='check'?900:kind==='mate'?1200:kind==='brilliant'?1050:650;o.frequency.value=f;o.type=kind==='capture'?'sawtooth':'sine';g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}
function caps(){capBlack.innerHTML=capturedB.length?capturedB.map(t=>`<span class="capturedPiece" title="${names[t]}">${icon[t]}</span>`).join(''):'<span class="empty">None</span>';capWhite.innerHTML=capturedW.length?capturedW.map(t=>`<span class="capturedPiece" title="${names[t]}">${icon[t]}</span>`).join(''):'<span class="empty">None</span>';const w=capturedB.reduce((s,t)=>s+value[t],0),b=capturedW.reduce((s,t)=>s+value[t],0);scoreEl.textContent=`White ${w} — Black ${b}`}
function figure(p){return `<div class="figure ${names[p.type].toLowerCase()} ${p.type}"><div class="hat"></div><div class="head"></div><div class="body"></div><div class="staff"></div><div class="gem"></div></div><div class="tag">${names[p.type]}</div>`}
function render(){board.innerHTML='';const rows=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=String.fromCharCode(97+c)+(8-r),p=rows[r][c],el=document.createElement('div');el.className='sq '+((r+c)%2?'b':'a');if(sq===selected)el.classList.add('selected');if(lastSquares.includes(sq))el.classList.add('last');if(selected){const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)el.classList.add(m.captured?'capture':'legal')}if(p&&game.inCheck()){const k=game.board().flat().findIndex(x=>x?.type==='k'&&x.color===game.turn());if(k>=0&&k===r*8+c)el.classList.add('check')}
if(c===0){const z=document.createElement('span');z.className='coord rank';z.textContent=8-r;el.appendChild(z)}if(r===7){const z=document.createElement('span');z.className='coord file';z.textContent=String.fromCharCode(97+c);el.appendChild(z)}if(p){const q=document.createElement('div');q.className='piece '+(p.color==='w'?'white':'black');q.innerHTML=figure(p);q.onclick=e=>{e.stopPropagation();handlePieceClick(sq,p)};el.appendChild(q)}el.onclick=()=>handleSquareClick(sq);board.appendChild(el)}caps()}
function handlePieceClick(sq,p){if(locked||game.turn()!=='w'||game.isGameOver())return;if(p.color==='w'){select(sq);return}if(selected){const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)makeMove(selected,sq,true);else badMove()}}
function select(sq){if(game.turn()!=='w'||locked||game.isGameOver())return;const moves=game.moves({square:sq});if(!moves.length){badMove();return}selected=selected===sq?null:sq;render()}
function handleSquareClick(sq){if(locked||game.turn()!=='w'||game.isGameOver())return;const p=game.get(sq);if(p?.color==='w'){select(sq);return}if(!selected)return;const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(!m){badMove();return}makeMove(selected,sq,true)}
function badMove(){reaction.textContent='Oops! Try a highlighted square.';showFlash('OOPS','oops');beep('bad')}
function addMove(san,human){moveNo++;movesEl.innerHTML+=`<div><b>${moveNo}.</b> ${human?'You':'CPU'} — ${san}</div>`;movesEl.scrollTop=movesEl.scrollHeight}
function makeMove(from,to,human){if(locked&&!human)return;let mv;const target=game.get(to);try{mv=game.move({from,to,promotion:'q'})}catch(e){badMove();return}lastSquares=[mv.from,mv.to];selected=null;addMove(mv.san,human);last.textContent=(human?'You: ':'CPU: ')+mv.san;
if(target||mv.captured){if(human)capturedB.push(mv.captured);else capturedW.push(mv.captured);reaction.textContent=human?'⚔ Great capture!':'⚔ CPU captured a wizard!';showFlash('CAPTURE!','good');beep('capture')}else if(human){const praise=Math.random()<.28?'NICE MOVE!':'GOOD MOVE!';reaction.textContent=praise;showFlash(praise,'good');beep('move')}else{reaction.textContent='CPU played '+mv.san;beep('move')}
render();if(game.isCheckmate()){locked=true;thinking.style.display='none';status.textContent=game.turn()==='w'?'CHECKMATE — CPU WINS!':'CHECKMATE — YOU WIN!';reaction.textContent=game.turn()==='w'?'The CPU trapped your King.':'You defeated the CPU!';showFlash('CHECKMATE!','mate');beep('mate');return}if(game.isDraw()){locked=true;status.textContent='DRAW GAME';reaction.textContent='The wizards agree to a draw.';showFlash('DRAW');return}if(game.inCheck()){status.textContent=game.turn()==='w'?'⚠ YOUR KING IS IN CHECK!':'⚠ CPU KING IS IN CHECK!';reaction.textContent='⚠ Check! Find a safe move.';showFlash('CHECK!','check');beep('check')}else status.textContent=game.turn()==='w'?'Your turn — choose a wizard.':'CPU turn…';if(human){locked=true;thinking.style.display='block';setTimeout(cpu,500)}}
function evaluate(){if(game.isCheckmate())return game.turn()==='b'?999999:-999999;if(game.isDraw())return 0;let s=0;for(const row of game.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*value[p.type];const mobility=game.moves({verbose:true}).length;s+=(game.turn()==='b'?mobility:-mobility)*2;return s}
function minimax(depth,maxBlack,alpha,beta){if(depth<=0||game.isGameOver())return evaluate();const ms=game.moves({verbose:true});if(maxBlack){let best=-1e9;for(const m of ms){game.move(m);best=Math.max(best,minimax(depth-1,false,alpha,beta));game.undo();alpha=Math.max(alpha,best);if(alpha>=beta)break}return best}else{let best=1e9;for(const m of ms){game.move(m);best=Math.min(best,minimax(depth-1,true,alpha,beta));game.undo();beta=Math.min(beta,best);if(alpha>=beta)break}return best}}
function cpuPick(){const d={amateur:1,professional:2,expert:3}[difficulty.value];const ms=game.moves({verbose:true});const scored=[];for(const m of ms){game.move(m);let s=minimax(Math.max(0,d-1),false,-1e9,1e9);game.undo();if(m.captured)s+=difficulty.value==='amateur'?300:900;if(m.san.includes('+'))s+=2500;if(m.san.includes('#'))s+=100000;if(previousCpu&&m.from===previousCpu.to&&m.to===previousCpu.from)s-=12000;scored.push({m,s})}scored.sort((a,b)=>b.s-a.s);if(difficulty.value==='amateur'){const pool=scored.slice(0,Math.min(7,scored.length));return pool[Math.floor(Math.random()*pool.length)].m}if(difficulty.value==='professional'){const pool=scored.slice(0,Math.min(3,scored.length));return pool[Math.floor(Math.random()*pool.length)].m}return scored[0].m}
async function cpu(){if(game.turn()!=='b'||game.isGameOver())return;thinking.style.display='block';status.textContent='🧠 CPU is thinking…';locked=true;await new Promise(r=>setTimeout(r,450+Math.random()*500));if(game.turn()!=='b'||game.isGameOver())return;const m=cpuPick();previousCpu=m;locked=false;const before=game.fen();makeMove(m.from,m.to,false);thinking.style.display='none';if(!game.isGameOver()){status.textContent=game.inCheck()?'⚠ CHECK!':'Your turn — choose a wizard.';if(difficulty.value==='expert'&&m.san.includes('+')){reaction.textContent='✨ Brilliant tactical move!';showFlash('BRILLIANT!','brilliant');beep('brilliant')}}}
function reset(){game.reset();selected=null;locked=false;lastSquares=[];capturedW=[];capturedB=[];previousCpu=null;moveNo=0;last.textContent='';movesEl.innerHTML='';reaction.textContent='Make your move!';thinking.style.display='none';status.textContent='Your turn — choose a wizard.';render()}
$('reset').onclick=reset;reset();
</script></body></html>
