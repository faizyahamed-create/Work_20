<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wizard Chess</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#4b2c39 0,#1b1018 48%,#08060a 100%);color:#fff;font-family:Georgia,serif}body{padding:14px;display:flex;justify-content:center}.app{width:min(1180px,100%);display:grid;grid-template-columns:205px minmax(0,720px) 190px;gap:14px;align-items:start}.panel,.side{background:linear-gradient(145deg,#20131a,#0d090d);border:1px solid #8b6670;border-radius:14px;padding:13px;box-shadow:0 18px 55px #000b}.panel h1{font-size:23px;margin:0 0 5px}.sub{font:12px system-ui;color:#d8c7ca;margin-bottom:10px}.status{font:700 14px system-ui;min-height:40px;line-height:1.35}.controls{display:grid;gap:8px}.controls select,.controls button{width:100%;padding:9px;border-radius:8px;border:1px solid #b48a59;background:#26191b;color:#fff;font-weight:700;cursor:pointer}.controls button{background:linear-gradient(#8a5b35,#4a2a20)}.thinking{display:none;color:#f0c27b;font:700 12px system-ui;margin-top:8px}.last{font:12px system-ui;color:#cfc0c3;margin-top:8px}.moves{margin-top:9px;max-height:180px;overflow:auto;font:11px system-ui;color:#cfc0c3;background:#100c10;border-radius:8px;padding:7px}.moves div{padding:3px 0;border-bottom:1px solid #ffffff10}.help{font:11px system-ui;color:#aaa0a4;line-height:1.45;margin-top:10px}.game{min-width:0}.boardFrame{width:100%;padding:12px;background:linear-gradient(135deg,#3d2118,#d09a50 18%,#6a3e27 50%,#c18b45 82%,#3a2018);border:3px solid #d9ae68;border-radius:15px;box-shadow:0 22px 70px #000d}.boardShell{display:grid;grid-template-columns:24px 1fr;grid-template-rows:1fr 24px;gap:0 3px}.ranks{grid-column:1;grid-row:1;display:grid;grid-template-rows:repeat(8,1fr);align-items:center;text-align:center;font:700 12px system-ui;color:#f5dfb4}.files{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(8,1fr);align-items:center;text-align:center;font:700 12px system-ui;color:#f5dfb4}.board{grid-column:2;grid-row:1;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:5px solid #2a1816;border-radius:4px;overflow:hidden;background:#c7aa7a;user-select:none;touch-action:manipulation}.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}.sq.a{background:#e9d8b5}.sq.b{background:#9a6747}.sq:hover{filter:brightness(1.06)}.sq.selected{box-shadow:inset 0 0 0 4px #f3c657}.sq.last{box-shadow:inset 0 0 0 999px #e6b45b38}.sq.legal:after{content:"";width:14%;height:14%;border-radius:50%;background:#6b3b2a;box-shadow:0 0 0 3px #fff5;position:absolute;z-index:3}.sq.capture:after{content:"";width:78%;height:78%;border:5px solid #c63e32;border-radius:50%;box-shadow:0 0 14px #d9573d;position:absolute;z-index:3}.sq.check{box-shadow:inset 0 0 0 5px #d32f3f,inset 0 0 22px #d32f3f66}.piece{position:relative;z-index:5;width:96%;height:96%;display:flex;align-items:center;justify-content:center;cursor:pointer;filter:drop-shadow(0 6px 4px #0008);transition:transform .12s}.piece:hover{transform:translateY(-3px) scale(1.04)}.piece svg{width:92%;height:92%;display:block;overflow:visible}.piece.white svg .fill{fill:#f4efe4}.piece.white svg .shade{fill:#d5c8b5}.piece.white svg .edge{stroke:#5d4539}.piece.white svg .accent{fill:#b8873d}.piece.black svg .fill{fill:#242126}.piece.black svg .shade{fill:#454047}.piece.black svg .edge{stroke:#111015}.piece.black svg .accent{fill:#9b6bc0}.piece svg .edge{stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.piece svg .accentStroke{stroke:#b8873d;stroke-width:3;fill:none}.piece.black svg .accentStroke{stroke:#9b6bc0}.capturedPiece{width:38px;height:38px;border-radius:7px;background:#21171a;border:1px solid #6f5048;display:flex;align-items:center;justify-content:center}.capturedPiece svg{width:32px;height:32px}.side h3{margin:0 0 10px;font-size:16px}.capGroup{margin-bottom:14px}.capTitle{font:10px system-ui;color:#aaa0a4;margin-bottom:5px}.caps{display:flex;flex-wrap:wrap;gap:5px;min-height:38px}.empty{font:11px system-ui;color:#756b70}.reaction{margin-top:12px;padding:10px;border-radius:9px;background:#161012;border:1px solid #584248;font:700 14px Georgia;text-align:center;min-height:45px}.score{font:11px system-ui;color:#a9989e;margin-top:8px;text-align:center}.flash{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;z-index:30;font:bold clamp(42px,8vw,92px) Georgia;text-shadow:0 0 10px #fff,0 0 28px #e0a55c,0 5px 0 #321c17}.flash.show{animation:flash .95s ease-out}.flash.good{color:#e8ffb0}.flash.check{color:#fff08a}.flash.mate{color:#ff8b8b}.flash.oops{color:#ffb29e}.flash.brilliant{color:#8ee8ff}.flash.capture{color:#ffd27c}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.12)}}@media(max-width:1080px){.app{grid-template-columns:190px minmax(0,720px)}.side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:12px}.side h3{grid-column:1/-1}}@media(max-width:760px){body{padding:6px}.app{grid-template-columns:1fr}.game{order:1}.panel{order:2}.side{order:3;grid-column:auto;display:block}.boardFrame{padding:7px;border-width:2px}.boardShell{grid-template-columns:18px 1fr;grid-template-rows:1fr 18px}.ranks,.files{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<section class="panel"><h1>🧙 Wizard Chess</h1><div class="sub">Fantasy chess • You play White</div><div id="status" class="status">Your turn — choose a wizard.</div><div class="controls"><select id="difficulty"><option value="amateur">Amateur</option><option value="professional" selected>Professional</option><option value="expert">Expert</option></select><button id="reset">New Game</button></div><div id="thinking" class="thinking">🧠 CPU is thinking…</div><div id="last" class="last"></div><div id="moves" class="moves"></div><div class="help"><b>Easy controls</b><br>Click your wizard, then click a glowing square. A red ring means capture.</div></section>
<main class="game"><div class="boardFrame"><div class="boardShell"><div id="ranks" class="ranks"></div><div id="board" class="board"></div><div id="files" class="files"></div></div></div></main>
<aside class="side"><h3>⚔ Captured Wizards</h3><div class="capGroup"><div class="capTitle">YOUR CAPTURES</div><div id="capBlack" class="caps"><span class="empty">None</span></div></div><div class="capGroup"><div class="capTitle">CPU CAPTURES</div><div id="capWhite" class="caps"><span class="empty">None</span></div></div><div id="reaction" class="reaction">Make your move!</div><div id="score" class="score">White 0 — Black 0</div></aside>
</div><div id="flash" class="flash"></div>
<script type="module">
import {Chess} from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';
const $=id=>document.getElementById(id),board=$('board'),status=$('status'),thinking=$('thinking'),last=$('last'),movesEl=$('moves'),difficulty=$('difficulty'),capBlack=$('capBlack'),capWhite=$('capWhite'),reaction=$('reaction'),flash=$('flash'),scoreEl=$('score'),ranks=$('ranks'),files=$('files');
const game=new Chess();let selected=null,locked=false,lastSquares=[],capturedW=[],capturedB=[],previousCpu=null,history=[];
const names={p:'Apprentice',n:'Knight',b:'Seer',r:'Guardian',q:'Queen',k:'King'},value={p:100,n:320,b:330,r:500,q:900,k:20000};
function svgPiece(type,color){let body='';if(type==='p')body=`<path class="fill edge" d="M38 78h24l5 8H33z"/><path class="fill edge" d="M40 78c2-7 2-15 0-22 0-4 4-7 10-7s10 3 10 7c-2 7-2 15 0 22z"/><circle class="fill edge" cx="50" cy="39" r="10"/><path class="fill edge" d="M37 38l13-23 13 23z"/><path class="accentStroke" d="M39 38h22"/>`;if(type==='n')body=`<path class="fill edge" d="M31 82h38l4 7H27z"/><path class="fill edge" d="M37 81c4-12 3-20-3-28 8-4 13-12 12-23 10 2 17 9 18 20 1 11-4 19-9 31z"/><path class="shade edge" d="M49 33l9 2 6 7-8 3-6-5z"/><path class="fill edge" d="M45 29l-4-12 9 6 8-4-4 13z"/><circle class="accent" cx="57" cy="35" r="2.5"/>`;if(type==='b')body=`<path class="fill edge" d="M31 82h38l4 7H27z"/><path class="fill edge" d="M39 82c3-10 4-18 3-26-1-8 4-14 8-17 4 3 9 9 8 17-1 8 0 16 3 26z"/><path class="fill edge" d="M38 40l12-24 12 24z"/><path class="accentStroke" d="M45 35l10-15"/>`;if(type==='r')body=`<path class="fill edge" d="M28 82h44l4 7H24z"/><path class="fill edge" d="M35 82c3-11 3-26 3-38h24c0 12 0 27 3 38z"/><path class="fill edge" d="M34 42V19h8v6h7v-6h8v6h7v-6h8v23z"/><path class="accentStroke" d="M39 49h22"/>`;if(type==='q')body=`<path class="fill edge" d="M27 82h46l4 7H23z"/><path class="fill edge" d="M34 82c4-11 4-24 3-35 9 4 17 4 26 0-1 11-1 24 3 35z"/><path class="fill edge" d="M33 48l5-29 12 16 12-16 5 29z"/><circle class="accent" cx="38" cy="19" r="4"/><circle class="accent" cx="50" cy="35" r="4"/><circle class="accent" cx="62" cy="19" r="4"/>`;if(type==='k')body=`<path class="fill edge" d="M26 82h48l4 7H22z"/><path class="fill edge" d="M33 82c4-12 4-27 4-37h26c0 10 0 25 4 37z"/><path class="fill edge" d="M35 46l4-23h22l4 23z"/><path class="fill edge" d="M46 23V8h8v15h15v8H54v8h-8v-8H31v-8z"/><path class="accentStroke" d="M39 50h22"/>`;return `<svg viewBox="0 0 100 100" aria-label="${names[type]}"><g>${body}</g></svg>`}
function flashMsg(text,type='good'){flash.textContent=text;flash.className='flash '+type;void flash.offsetWidth;flash.classList.add('show');setTimeout(()=>flash.className='flash',1000)}
function beep(kind='move'){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=kind==='capture'?170:kind==='check'?880:620;o.type=kind==='capture'?'sawtooth':'sine';g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function captured(){capBlack.innerHTML=capturedB.length?capturedB.map(t=>`<span class="capturedPiece" title="${names[t]}">${svgPiece(t,'b')}</span>`).join(''):'<span class="empty">None</span>';capWhite.innerHTML=capturedW.length?capturedW.map(t=>`<span class="capturedPiece" title="${names[t]}">${svgPiece(t,'w')}</span>`).join(''):'<span class="empty">None</span>';const w=capturedB.reduce((s,t)=>s+value[t],0),b=capturedW.reduce((s,t)=>s+value[t],0);scoreEl.textContent=`White ${w} — Black ${b}`}
function render(){board.innerHTML='';ranks.innerHTML=[8,7,6,5,4,3,2,1].map(n=>`<span>${n}</span>`).join('');files.innerHTML=['a','b','c','d','e','f','g','h'].map(n=>`<span>${n}</span>`).join('');const rows=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=String.fromCharCode(97+c)+(8-r),p=rows[r][c],el=document.createElement('div');el.className='sq '+((r+c)%2?'b':'a');if(sq===selected)el.classList.add('selected');if(lastSquares.includes(sq))el.classList.add('last');if(game.inCheck()&&p?.type==='k'&&p.color===game.turn())el.classList.add('check');if(selected){const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)el.classList.add(m.captured?'capture':'legal')}if(p){const q=document.createElement('div');q.className='piece '+(p.color==='w'?'white':'black');q.innerHTML=svgPiece(p.type,p.color);q.onclick=e=>{e.stopPropagation();pieceClick(sq,p)};el.appendChild(q)}el.onclick=()=>squareClick(sq);board.appendChild(el)}captured()}
function pieceClick(sq,p){if(locked||game.turn()!=='w'||game.isGameOver())return;if(p.color==='w'){select(sq);return}if(selected){const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)humanMove(selected,sq);else bad()}}
function select(sq){if(game.turn()!=='w'||locked||game.isGameOver())return;const p=game.get(sq);if(!p||p.color!=='w')return;const moves=game.moves({square:sq});if(!moves.length){bad();return}selected=selected===sq?null:sq;render()}
function squareClick(sq){if(locked||game.turn()!=='w'||game.isGameOver())return;const p=game.get(sq);if(p?.color==='w'){select(sq);return}if(!selected)return;const m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)humanMove(selected,sq);else bad()}
function bad(){reaction.textContent='Oops! Choose a highlighted square.';flashMsg('OOPS!','oops');beep('bad')}
function updateHistory(){movesEl.innerHTML=history.map((m,i)=>`<div>${i+1}. ${m}</div>`).join('');movesEl.scrollTop=movesEl.scrollHeight}
function finish(mv,human){lastSquares=[mv.from,mv.to];selected=null;render();if(game.isCheckmate()){locked=true;thinking.style.display='none';status.textContent=game.turn()==='w'?'CHECKMATE — CPU WINS!':'CHECKMATE — YOU WIN!';reaction.textContent=game.turn()==='w'?'The CPU trapped your King.':'You defeated the CPU!';flashMsg('CHECKMATE!','mate');beep('check');return true}if(game.isDraw()){locked=true;status.textContent='DRAW GAME';reaction.textContent='The wizards agree to a draw.';flashMsg('DRAW');return true}if(game.inCheck()){status.textContent=game.turn()==='w'?'⚠ YOUR KING IS IN CHECK!':'⚠ CPU KING IS IN CHECK!';reaction.textContent='⚠ Check! Find a safe move.';flashMsg('CHECK!','check');beep('check')}else status.textContent=game.turn()==='w'?'Your turn — choose a wizard.':'CPU turn…';return false}
function humanMove(from,to){if(locked)return;let mv;const target=game.get(to);try{mv=game.move({from,to,promotion:'q'})}catch(e){bad();return}history.push(mv.san);last.textContent='You: '+mv.san;if(target||mv.captured){capturedB.push(mv.captured);reaction.textContent='⚔ Great capture!';flashMsg('CAPTURE!','capture');beep('capture')}else{const praise=Math.random()<.35?'NICE MOVE!':'GOOD MOVE!';reaction.textContent=praise;flashMsg(praise,'good');beep()}updateHistory();if(finish(mv,true))return;locked=true;thinking.style.display='block';setTimeout(cpu,550)}
function evaluate(){if(game.isCheckmate())return game.turn()==='b'?999999:-999999;if(game.isDraw())return 0;let s=0;for(const row of game.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*value[p.type];s+=game.moves().length*(game.turn()==='b'?2:-2);return s}
function minimax(depth,maxBlack,alpha,beta){if(depth<=0||game.isGameOver())return evaluate();const ms=game.moves({verbose:true});if(maxBlack){let best=-1e9;for(const m of ms){game.move(m);best=Math.max(best,minimax(depth-1,false,alpha,beta));game.undo();alpha=Math.max(alpha,best);if(alpha>=beta)break}return best}else{let best=1e9;for(const m of ms){game.move(m);best=Math.min(best,minimax(depth-1,true,alpha,beta));game.undo();beta=Math.min(beta,best);if(alpha>=beta)break}return best}}
function cpuPick(){const d={amateur:1,professional:2,expert:3}[difficulty.value],ms=game.moves({verbose:true}),scored=[];for(const m of ms){game.move(m);let s=minimax(Math.max(0,d-1),false,-1e9,1e9);game.undo();if(m.captured)s+=difficulty.value==='amateur'?300:900;if(m.san.includes('+'))s+=2500;if(m.san.includes('#'))s+=100000;if(previousCpu&&m.from===previousCpu.to&&m.to===previousCpu.from)s-=12000;scored.push({m,s})}scored.sort((a,b)=>b.s-a.s);if(difficulty.value==='amateur'){const pool=scored.slice(0,Math.min(7,scored.length));return pool[Math.floor(Math.random()*pool.length)].m}if(difficulty.value==='professional'){const pool=scored.slice(0,Math.min(3,scored.length));return pool[Math.floor(Math.random()*pool.length)].m}return scored[0].m}
async function cpu(){if(game.turn()!=='b'||game.isGameOver())return;status.textContent='🧠 CPU is thinking…';await new Promise(r=>setTimeout(r,450+Math.random()*500));if(game.turn()!=='b'||game.isGameOver())return;const m=cpuPick();previousCpu=m;locked=false;const target=game.get(m.to);let mv;try{mv=game.move({from:m.from,to:m.to,promotion:'q'})}catch(e){locked=false;thinking.style.display='none';return}history.push(mv.san);last.textContent='CPU: '+mv.san;if(target||mv.captured){capturedW.push(mv.captured);reaction.textContent='⚔ CPU captured a wizard!';flashMsg('CAPTURE!','capture');beep('capture')}else if(difficulty.value==='expert'&&(mv.san.includes('+')||mv.san.includes('#'))){reaction.textContent='✨ Brilliant tactical move!';flashMsg('BRILLIANT!','brilliant');beep('check')}else reaction.textContent='CPU played '+mv.san;updateHistory();thinking.style.display='none';finish(mv,false);if(!game.isGameOver())locked=false}
function reset(){game.reset();selected=null;locked=false;lastSquares=[];capturedW=[];capturedB=[];previousCpu=null;history=[];last.textContent='';movesEl.innerHTML='';reaction.textContent='Make your move!';thinking.style.display='none';status.textContent='Your turn — choose a wizard.';render()}
$('reset').onclick=reset;reset();
</script>
</body>
</html>
